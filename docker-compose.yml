# Qdrant server for Student-Path.
#
# Development uses embedded Qdrant by default (QDRANT_PATH, no Docker needed).
# To use this server instead:
#   docker compose up -d
#   set QDRANT_URL=http://localhost:6333 in .env
#   uv run sp check
# Dashboard: http://localhost:6333/dashboard
#
# Keep the image's minor version in step with qdrant-client in uv.lock (currently 1.20).
# Phase P7 adds the api and ui services to this file.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: student-path-qdrant
    ports:
      - "6333:6333" # REST + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  # Server data lives in a Docker volume. It is separate from data/qdrant/, which
  # holds embedded-mode files in a different on-disk format.
  qdrant_storage:
