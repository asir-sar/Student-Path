# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files
# Ruff and pyright run through uv, so they use the versions pinned in uv.lock.
# Superseded v1 code stays byte-for-byte unchanged (experiment E1 baseline, ADR-014)
exclude: ^src/student_path/legacy/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: local
    hooks:
      # .env.example is public: keys, secrets, tokens and passwords must stay empty there (real values go in .env)
      - id: no-secrets-in-env-example
        name: no secret values in .env.example
        language: pygrep
        entry: '^[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*=\S'
        files: ^\.env\.example$
      # invisible characters in source hide bugs; write them as escapes (e.g. "\u00ad")
      - id: no-invisible-characters
        name: no invisible characters in Python source
        language: pygrep
        entry: '[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]|\xc2\xad|\xe2\x80[\x8b-\x8f]|\xe2\x81\xa0|\xef\xbb\xbf|\xef\xbf\xbe'  # UTF-8 bytes: pygrep matches bytes
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
